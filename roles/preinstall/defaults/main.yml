---
devbox_preinstall_enabled: true
devbox_preinstall_profile: core

devbox_preinstall_core_apt_packages:
  - build-essential
  - iputils-ping
  - openssh-client
  - procps
  - unzip
  - zsh
  - ripgrep
  - python3-pip
  - gnupg

devbox_preinstall_desktop_e2e_apt_packages:
  - xvfb
  - x11vnc
  - pulseaudio
  - pulseaudio-utils
  - alsa-utils
  - dbus
  - dbus-x11
  - libgtk-3-0
  - libasound2
  - libnss3
  - libxkbcommon0
  - libxss1
  - libgbm1
  - libatk1.0-0
  - libatk-bridge2.0-0
  - libcairo2
  - libcups2
  - libdrm2
  - libpango-1.0-0
  - libx11-xcb1
  - libxcomposite1
  - libxdamage1
  - libxrandr2

devbox_preinstall_node_major: "22"
devbox_preinstall_uv_version: "0.10.0"
devbox_preinstall_kubectl_version: "v1.33.6"
devbox_preinstall_coder_version: "2.30.0"
devbox_preinstall_install_gh: true
devbox_preinstall_install_awscli: true
devbox_preinstall_install_kubectl: true
devbox_preinstall_install_coder_cli: true
